version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:17"
      timezone: Etc/UTC
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      compatible-development-tools:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:43"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    groups:
      compatible-action-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
