name: Set up a frozen consumer lane
description: Retain producer tools, provision a floor-compatible npm, then select the exact consumer Node
inputs:
  node:
    description: Exact Node version from the frozen matrix
    required: true
  matrix:
    description: Complete frozen matrix
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-producer
    - shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Verify the transported archive using producer tools
      shell: bash
      run: node scripts/prepare-downloaded-candidate.mjs --candidate .release/runtime-candidate
    - name: Prepare the native consumer package manager
      shell: bash
      env:
        OWLAPI_RUNTIME_MATRIX: ${{ inputs.matrix }}
        OWLAPI_EXPECTED_NODE: ${{ inputs.node }}
      run: node scripts/consumer-runtime-tools.mjs prepare
    - name: Select the exact frozen consumer Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node }}
        check-latest: false
        cache: ""
        package-manager-cache: false
    - name: Assert the actual consumer runtime and npm compatibility
      shell: bash
      env:
        OWLAPI_RUNTIME_MATRIX: ${{ inputs.matrix }}
        OWLAPI_EXPECTED_NODE: ${{ inputs.node }}
      run: node scripts/consumer-runtime-tools.mjs assert
