name: Require every frozen consumer lane
description: Validate complete candidate-bound runtime reports and retain the qualification summary
inputs:
  matrix:
    description: Frozen runtime matrix
    required: true
  lanes-result:
    description: Result of the complete consumer matrix job
    required: true
  candidate-id:
    description: Same-run candidate artifact ID
    required: true
  candidate-digest:
    description: Same-run candidate artifact digest
    required: true
outputs:
  coverage:
    description: Candidate-bound matrix and report identity
    value: ${{ steps.require.outputs.coverage }}
  artifact-id:
    description: Retained runtime qualification evidence
    value: ${{ steps.upload.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-producer
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: consumer-runtime-*-attempt-${{ github.run_attempt }}
        path: .release/runtime-reports
        merge-multiple: false
        skip-decompress: false
        digest-mismatch: error
    - id: require
      shell: bash
      env:
        OWLAPI_RUNTIME_MATRIX: ${{ inputs.matrix }}
        OWLAPI_RUNTIME_LANES_RESULT: ${{ inputs.lanes-result }}
        OWLAPI_CANDIDATE_ID: ${{ inputs.candidate-id }}
        OWLAPI_CANDIDATE_DIGEST: ${{ inputs.candidate-digest }}
      run: node scripts/aggregate-consumer-runtimes.mjs
    - id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: runtime-qualification-${{ github.run_id }}-${{ github.run_attempt }}
        path: .release/runtime-qualification/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0
        overwrite: false
        include-hidden-files: false
        archive: true
