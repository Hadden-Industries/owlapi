name: Reproducible bug or regression
description: Report incorrect behavior in a supported owlapi environment.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please remove private ontology data and reduce the reproducer where practical.
  - type: input
    id: version
    attributes:
      label: owlapi version
      placeholder: 0.1.0-alpha.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node/browser, operating system, package manager, and consumption mode.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest ontology, code, and exact commands that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and diagnostics
    validations:
      required: true
