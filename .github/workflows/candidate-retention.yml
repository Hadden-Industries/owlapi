name: Retire predecessor candidate artifacts

on:
  workflow_dispatch:
    inputs:
      retention_history_object:
        description: Optional signed protected history object for candidate retirement
        type: string
        required: false
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: owlapi-release
  cancel-in-progress: false
  queue: max

jobs:
  retire:
    name: Retire predecessor candidate artifacts
    if: >-
      github.repository == 'Hadden-Industries/owlapi' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected &&
      ((github.event_name == 'workflow_dispatch' &&
      github.actor == 'maksymshostak' &&
      github.triggering_actor == 'maksymshostak') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'CI' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write
      pull-requests: read
      checks: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: freeze
        uses: ./.github/actions/freeze-runtime-matrix
      - name: Verify custody and retire eligible predecessor artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OWLAPI_RUNTIME_MATRIX: ${{ steps.freeze.outputs.matrix }}
          RETENTION_HISTORY_OBJECT: ${{ inputs.retention_history_object }}
        run: node scripts/release-retention.mjs --apply
