name: Stage qualified OwlAPI package

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Original successful release qualification run
        type: string
        required: true
      qualification_attempt:
        description: Original producing attempt
        type: string
        required: true
      manifest_sha256:
        description: Owner-reviewed SHA-256 of the retained manifest
        type: string
        required: true
      history_object:
        description: Signed stage intent, guarded labels, and settled prior operations
        type: string
        required: true
      channel:
        description: Initial public tag on interactive approval
        type: choice
        options: [pilot, latest]
        default: pilot
        required: true

permissions: {}
concurrency:
  group: owlapi-release
  cancel-in-progress: false
  queue: max
env:
  HISTORY_OBJECT: ${{ inputs.history_object }}
  QUALIFICATION_RUN: ${{ inputs.qualification_run }}
  QUALIFICATION_ATTEMPT: ${{ inputs.qualification_attempt }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  RELEASE_CHANNEL: ${{ inputs.channel }}

jobs:
  admit:
    if: github.repository == 'Hadden-Industries/owlapi' && github.ref == 'refs/heads/main'
    environment: release-manual
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.origin.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - id: origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/staged-release.mjs admit
  stage:
    needs: admit
    environment: npm-release
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
      security-events: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.admit.outputs.artifact_id }}
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/owlapi-stage-input/candidate
          merge-multiple: false
          digest-mismatch: error
      - name: Stage the admitted tarball
        working-directory: ${{ runner.temp }}/owlapi-stage-input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node "$GITHUB_WORKSPACE/scripts/staged-release.mjs" stage
      - name: Retain original stage journal
        if: ${{ !cancelled() }}
        uses: ./.github/actions/retain-artifact
        with:
          name: release-stage-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/stage
          retention-days: 90
