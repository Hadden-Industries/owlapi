name: Release reconciliation

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: owlapi-release
  cancel-in-progress: false
  queue: max

jobs:
  source_verification:
    name: Release reconciliation / source verified
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      candidate_artifact_digest: ${{ steps.candidate_upload.outputs.artifact-digest }}
      candidate_artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      candidate_artifact_name: owlapi-${{ steps.metadata.outputs.version }}-reconciled-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      channel: ${{ steps.metadata.outputs.channel }}
      coordinate: ${{ steps.metadata.outputs.coordinate }}
      reconciliation_artifact_id: ${{ steps.evidence_upload.outputs.artifact-id }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      source_run_id: ${{ steps.metadata.outputs.source_run_id }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the accepted repair commit and complete tag graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Select authoritative Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.19.0 --npm 12.0.2
        timeout-minutes: 5
      - name: Install the reviewed reconciliation tools
        run: npm ci
        timeout-minutes: 15
      - name: Derive the closed source and artifact coordinates
        id: metadata
        run: node scripts/release-reconciliation.mjs --emit-metadata
        timeout-minutes: 5
      - name: Download the exact retained candidate from the failed release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.metadata.outputs.candidate_artifact_id }}
          github-token: ${{ github.token }}
          repository: Hadden-Industries/owlapi
          run-id: ${{ steps.metadata.outputs.source_run_id }}
          path: .release/source-candidate
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Download the exact retained publication-preflight evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.metadata.outputs.publication_preflight_artifact_id }}
          github-token: ${{ github.token }}
          repository: Hadden-Industries/owlapi
          run-id: ${{ steps.metadata.outputs.source_run_id }}
          path: .release/source-preflight
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Reverify the independent signed source tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
        run: node scripts/verify-release-tag.mjs --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output .release/tag-verification.json
        timeout-minutes: 5
      - name: Prove the source run, unused coordinate, and byte-identical package
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-reconciliation.mjs --candidate .release/source-candidate --publication-preflight .release/source-preflight/publication-preflight.json --tag-verification .release/tag-verification.json --output .release/reconciliation-verification.json
        timeout-minutes: 10
      - name: Retain the exact candidate for same-run promotion
        id: candidate_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owlapi-${{ steps.metadata.outputs.version }}-reconciled-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/source-candidate/owlapi-${{ steps.metadata.outputs.version }}.tgz
            .release/source-candidate/owlapi-${{ steps.metadata.outputs.version }}.cdx.json
            .release/source-candidate/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
      - name: Retain the reconciliation verification
        id: evidence_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reconciliation-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/reconciliation-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  accepted:
    name: Release reconciliation / accepted
    needs: source_verification
    environment:
      name: release-manual
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the accepted repair commit and signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Reverify the accepted signed source tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source_verification.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source_verification.outputs.source_commit }}
        run: node scripts/verify-release-tag.mjs --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output .release/tag-verification.json
        timeout-minutes: 5
      - name: Retain the accepted-tag evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reconciliation-tag-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/tag-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  draft_release:
    name: Release reconciliation / GitHub draft
    needs:
      - accepted
      - source_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the accepted release-write implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Install the reviewed GitHub-release tools
        run: npm ci
        timeout-minutes: 15
      - name: Download the exact same-run promotion candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source_verification.outputs.candidate_artifact_id }}
          path: .release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Create or exactly reconcile the draft and three candidate assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source_verification.outputs.tag }}
          RELEASE_VERSION: ${{ needs.source_verification.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source_verification.outputs.source_commit }}
        run: npm run release:draft-github -- --candidate .release/download --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output .release/draft-release.json
        timeout-minutes: 5
      - name: Retain the draft-release evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reconciliation-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/draft-release.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  npm_release:
    name: Release reconciliation / npm direct bootstrap
    needs:
      - accepted
      - draft_release
      - source_verification
    environment:
      name: npm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Select Node 24.19.0 and the exact public npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/
      - name: Establish the exact publication npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Download the exact same-run promotion candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source_verification.outputs.candidate_artifact_id }}
          path: .release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify the retained candidate checksums without executing package code
        working-directory: .release/download
        run: sha256sum --check --strict SHA256SUMS
        timeout-minutes: 5
      - name: Perform the single authorized direct-bootstrap write
        working-directory: .release/download
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish owlapi-0.1.0-alpha.0.tgz --provenance --tag next --access public --registry=https://registry.npmjs.org/
        timeout-minutes: 5

  registry_verification:
    name: Release reconciliation / fresh public registry
    needs:
      - npm_release
      - source_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the accepted registry-verification implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Install the reviewed public-verification tools
        run: npm ci
        timeout-minutes: 15
      - name: Download the exact same-run promotion candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source_verification.outputs.candidate_artifact_id }}
          path: .release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify the fresh public coordinate, bytes, channel, signatures, and exports
        run: npm run release:qualify-registry -- --candidate .release/download --output .release/registry-verification.json
        timeout-minutes: 15
      - name: Retain the public-registry evidence
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reconciliation-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/registry-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  release_evidence:
    name: Release reconciliation / evidence
    needs:
      - accepted
      - draft_release
      - npm_release
      - registry_verification
      - source_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out the accepted evidence implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Install the reviewed evidence tools
        run: npm ci
        timeout-minutes: 15
      - name: Download the exact same-run promotion candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source_verification.outputs.candidate_artifact_id }}
          path: .release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Download the source-reconciliation evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.source_verification.outputs.reconciliation_artifact_id }}
          path: .release/evidence-input/source
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Download the accepted-tag evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.accepted.outputs.artifact_id }}
          path: .release/evidence-input/tag
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Download the draft-release evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.draft_release.outputs.artifact_id }}
          path: .release/evidence-input/draft
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Download the public-registry evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.registry_verification.outputs.artifact_id }}
          path: .release/evidence-input/registry
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Generate and strictly validate the fourth release asset
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.source_verification.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.source_verification.outputs.candidate_artifact_digest }}
          CANDIDATE_ARTIFACT_NAME: ${{ needs.source_verification.outputs.candidate_artifact_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release:evidence -- --candidate .release/download --reconciliation .release/evidence-input/source/reconciliation-verification.json --tag-verification .release/evidence-input/tag/tag-verification.json --draft-release .release/evidence-input/draft/draft-release.json --registry-verification .release/evidence-input/registry/registry-verification.json --output .release/owlapi-0.1.0-alpha.0.release-evidence.json
        timeout-minutes: 5
      - name: Retain the strict release-evidence asset
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reconciliation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/owlapi-0.1.0-alpha.0.release-evidence.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  finalize_release:
    name: Release reconciliation / finalize immutable GitHub release
    needs:
      - release_evidence
      - source_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the accepted finalization implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Install the reviewed finalization tools
        run: npm ci
        timeout-minutes: 15
      - name: Download the exact same-run release evidence by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release_evidence.outputs.artifact_id }}
          path: .release/evidence
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Attach the fourth asset and publish the immutable prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.source_verification.outputs.source_commit }}
        run: npm run release:finalize-github -- --evidence .release/evidence/owlapi-0.1.0-alpha.0.release-evidence.json --source-commit "$SOURCE_COMMIT" --output .release/finalization.json
        timeout-minutes: 5

  immutable_verification:
    name: Release reconciliation / immutable verification
    needs:
      - finalize_release
      - source_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the accepted repair commit and signed source tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Install the reviewed immutable-verification tools
        run: npm ci
        timeout-minutes: 15
      - name: Download and checksum-verify GitHub CLI 2.98.0
        run: npm run release:prepare-github-cli -- --output .release/tools/github-cli
        timeout-minutes: 5
      - name: Reverify the independent signed source tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source_verification.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.source_verification.outputs.source_commit }}
        run: npm run release:verify-tag -- --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT" --output .release/final-tag-verification.json
        timeout-minutes: 5
      - name: Verify release immutability and all four release attestations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.source_verification.outputs.source_commit }}
        run: npm run release:verify-immutable -- --gh .release/tools/github-cli/gh_2.98.0_linux_amd64/bin/gh --source-commit "$SOURCE_COMMIT" --output-directory .release/immutable-assets --report .release/immutable-verification.json
        timeout-minutes: 10
      - name: Retain the final immutable-verification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reconciliation-immutable-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/immutable-verification.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
        timeout-minutes: 5
