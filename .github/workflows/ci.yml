name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  npm_config_fetch_retries: "2"
  npm_config_fetch_retry_factor: "10"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"
  npm_config_fetch_timeout: "300000"

jobs:
  verification:
    name: CI / verification strategy
    runs-on: ubuntu-24.04
    # Leave time for checkout/setup and both bounded API steps after a transfer failure.
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    outputs:
      reuse: ${{ steps.verify.outputs.reuse }}
      source_run_id: ${{ steps.verify.outputs.source_run_id }}
      source_run_attempt: ${{ steps.verify.outputs.source_run_attempt }}
      source_commit: ${{ steps.verify.outputs.source_commit }}
      candidate_artifact_id: ${{ steps.verify.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.verify.outputs.candidate_artifact_digest }}
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Find a same-repository successful PR receipt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-verification-command.mjs select
        timeout-minutes: 2
      - name: Download the exact selected receipt
        id: proof
        if: steps.select.outputs.available == 'true'
        # A failed optimization selects full CI; no test failure is tolerated.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          repository: Hadden-Industries/owlapi
          github-token: ${{ github.token }}
          path: .release/ci-reuse/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify equivalence or require full qualification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_DOWNLOAD_OUTCOME: ${{ steps.proof.outcome }}
        run: node scripts/ci-verification-command.mjs verify
        timeout-minutes: 2

  metadata:
    name: CI / metadata
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 5
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.21.0 --npm 12.1.0
        timeout-minutes: 5
      - name: Install the reviewed tool graph
        run: npm ci
        timeout-minutes: 8
      - name: Derive validated package metadata
        id: metadata
        run: npm run workflow:metadata
        timeout-minutes: 5
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5

  source_node_22:
    name: CI / Ubuntu / Node 22.23.3
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Select Node 22.23.3 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.3"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 22.23.3 --npm 12.1.0
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Verify formatting
        run: npm run format:check
        timeout-minutes: 45
      - name: Verify static quality
        run: npm run lint
        timeout-minutes: 45
      - name: Run the full package suite
        run: npm test -- --runInBand
        timeout-minutes: 45
      - name: Verify the public package boundary
        run: npm run test:boundary
        timeout-minutes: 45
      - name: Verify the release-gate registry
        run: npm run verify:release-gates
        timeout-minutes: 45
      - name: Verify repository workflow governance
        run: npm run verify:workflow-governance
        timeout-minutes: 45

  source_node_24:
    name: CI / Ubuntu / Node 24.21.0
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.21.0 --npm 12.1.0
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Verify formatting
        run: npm run format:check
        timeout-minutes: 45
      - name: Verify static quality
        run: npm run lint
        timeout-minutes: 45
      - name: Install checksum-pinned native workflow validation
        run: |
          tool_directory="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$tool_directory"
          archive="$tool_directory/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_directory"
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"
        timeout-minutes: 5
      - name: Validate native GitHub Actions syntax and expressions
        run: npm run verify:workflow-syntax
        timeout-minutes: 5
      - name: Check out the immutable original July ontology sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/universal-ontology
          ref: e2c667f3584b8fb705671cada0fe205b1000b617
          path: .release/universal-ontology
          persist-credentials: false
      - name: Check out the pinned Java OWLAPI reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: owlcs/owlapi
          ref: d7e997a53b470e32700de89cc610d9daf01ea769
          path: .release/java-owlapi
          persist-credentials: false
      - name: Select the reference JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          check-latest: false
          overwrite-settings: false
      - name: Build the native reference and its reactor classpath
        working-directory: .release/java-owlapi
        run: mvn -B -ntp -pl distribution -am -Dmaven.test.skip=true -Dno-javadoc=true -DincludeScope=runtime -Dmdep.outputFile=target/owlapi-runtime-classpath.txt package dependency:build-classpath
        timeout-minutes: 20
      - name: Run the full package suite
        env:
          OWLAPI_REFERENCE_CHECKOUT: ${{ github.workspace }}/.release/java-owlapi
        run: npm test -- --runInBand
        timeout-minutes: 45
      - name: Verify the public package boundary
        run: npm run test:boundary
        timeout-minutes: 45
      - name: Verify the release-gate registry
        run: npm run verify:release-gates
        timeout-minutes: 45
      - name: Verify repository workflow governance
        run: npm run verify:workflow-governance
        timeout-minutes: 45
      - name: Reconcile all four July variants in parsing and both closure formats
        env:
          OWLAPI_REFERENCE_CHECKOUT: ${{ github.workspace }}/.release/java-owlapi
        run: npm run test:universal-ontology -- --ontology-repository .release/universal-ontology --output .release/july-qualification
        timeout-minutes: 15
      - name: Retain July reconciliation evidence, including failed comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: july-ontology-reconciliation
          path: .release/july-qualification
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
          archive: true

  dependency_review:
    name: CI / dependency review
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.21.0 --npm 12.1.0
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 15
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Review introduced runtime vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          warn-only: false
          show-openssf-scorecard: false
          show-patched-versions: false
      - name: Record dependency-review applicability on main push
        if: github.event_name == 'push'
        run: npm run workflow:dependency-review-applicability
        timeout-minutes: 5

  candidate:
    name: CI / retained candidate
    needs:
      - metadata
      - source_node_22
      - source_node_24
      - dependency_review
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select authoritative Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.21.0 --npm 12.1.0
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Build and qualify the closed candidate bundle
        run: npm run release:pack
        timeout-minutes: 45
      - name: Upload the exact same-run candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: |
            .release/candidate/${{ needs.metadata.outputs.version }}/owlapi-${{ needs.metadata.outputs.version }}.tgz
            .release/candidate/${{ needs.metadata.outputs.version }}/owlapi-${{ needs.metadata.outputs.version }}.cdx.json
            .release/candidate/${{ needs.metadata.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  portability_windows_node_22:
