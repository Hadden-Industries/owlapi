name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  npm_config_fetch_retries: "2"
  npm_config_fetch_retry_factor: "10"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"
  npm_config_fetch_timeout: "300000"

jobs:
  runtime_matrix:
    name: CI / frozen consumer matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.freeze.outputs.matrix }}
      sha256: ${{ steps.freeze.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: freeze
        uses: ./.github/actions/freeze-runtime-matrix

  verification:
    name: CI / verification strategy
    needs: runtime_matrix
    env:
      OWLAPI_RUNTIME_MATRIX: ${{ needs.runtime_matrix.outputs.matrix }}
    runs-on: ubuntu-24.04
    # Leave time for bounded PR proof and optional concurrent-seed admission.
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    outputs:
      reuse: ${{ steps.seed_strategy.outputs.reuse }}
      source_run_id: ${{ steps.seed_strategy.outputs.source_run_id }}
      source_run_attempt: ${{ steps.seed_strategy.outputs.source_run_attempt }}
      source_commit: ${{ steps.seed_strategy.outputs.source_commit }}
      candidate_artifact_id: ${{ steps.seed_strategy.outputs.candidate_artifact_id }}
      candidate_artifact_digest: ${{ steps.seed_strategy.outputs.candidate_artifact_digest }}
      source_receipt_id: ${{ steps.seed_strategy.outputs.source_receipt_id }}
      source_receipt_digest: ${{ steps.seed_strategy.outputs.source_receipt_digest }}
      qualification: ${{ steps.seed_strategy.outputs.qualification }}
    steps:
      - name: Check out the exact proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select the policy-owned Node runtime
        uses: ./.github/actions/setup-producer
        with:
          phase: runtime
      - name: Find a same-repository successful PR receipt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-verification-command.mjs select
        timeout-minutes: 2
      - name: Download the exact selected receipt
        id: proof
        if: steps.select.outputs.available == 'true'
        # A failed optimization selects full CI; no test failure is tolerated.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          repository: Hadden-Industries/owlapi
          github-token: ${{ github.token }}
          path: .release/ci-reuse/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify equivalence or require full qualification
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_DOWNLOAD_OUTCOME: ${{ steps.proof.outcome }}
        run: node scripts/ci-verification-command.mjs verify
        timeout-minutes: 2
      - name: Reevaluate a Java cold-seed hint against current main products
        id: seed_select
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_OUTPUTS_JSON: ${{ toJSON(steps.verify.outputs) }}
        run: node scripts/java-reference-seed-command.mjs select
        timeout-minutes: 1
      - name: Download the exact possible concurrent Java seed and qualification
        id: seed_download
        if: steps.seed_select.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.seed_select.outputs.artifact_ids }}
          run-id: ${{ steps.seed_select.outputs.run_id }}
          repository: Hadden-Industries/owlapi
          github-token: ${{ github.token }}
          path: .release/java-reference-seed/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - id: seed_tools
        if: steps.seed_download.outcome == 'success'
        continue-on-error: true
        env:
          npm_config_fetch_retries: "0"
          npm_config_fetch_timeout: "30000"
        timeout-minutes: 2
        name: Install the conditional locked seed verifier
        uses: ./.github/actions/setup-producer
        with:
          phase: npm
          install: locked-no-scripts
      - name: Independently admit the concurrent seed or retain the cold-seed requirement
        id: seed_admit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFICATION_OUTPUTS_JSON: ${{ toJSON(steps.verify.outputs) }}
          REFERENCE_SEED_DOWNLOAD_OUTCOME: ${{ steps.seed_download.outcome }}
          REFERENCE_SEED_TOOLS_OUTCOME: ${{ steps.seed_tools.outcome }}
        run: node scripts/java-reference-seed-command.mjs admit
        timeout-minutes: 1
      - name: Select complete PR proof reuse or a full main seed run
        id: seed_strategy
        env:
          VERIFICATION_OUTPUTS_JSON: ${{ toJSON(steps.verify.outputs) }}
        run: node scripts/java-reference-seed-command.mjs strategy
        timeout-minutes: 1

  metadata:
    name: CI / metadata
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
        with:
          npm-timeout-minutes: "5"
      - name: Install the reviewed tool graph
        run: npm ci
        timeout-minutes: 8
      - name: Derive validated package metadata
        id: metadata
        run: npm run generate:workflow-metadata
        timeout-minutes: 5
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5

  source_node_22:
    name: CI / Ubuntu / Node 22.23.3
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
        with:
          node-family: "22"
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Select the pinned development Python
        id: quality_python
        run: node scripts/repository-python-tools.mjs python
        timeout-minutes: 10
      - name: Synchronize locked development tools
        run: npm run sync:python-tools -- --python-env QUALITY_PYTHON
        timeout-minutes: 5
        env:
          QUALITY_PYTHON: ${{ steps.quality_python.outputs.python-path }}
      - name: Verify formatting
        run: npm run format:source-python:check
        timeout-minutes: 45
      - name: Verify static quality
        run: npm run lint:source-python
        timeout-minutes: 45
      - name: Run the full package suite
        run: npm test -- --runInBand
        timeout-minutes: 45
      - name: Verify the public package boundary
        run: npm run test:boundary
        timeout-minutes: 45
      - name: Verify the release-gate registry
        run: npm run verify:release-gates
        timeout-minutes: 45
      - name: Verify repository workflow governance
        run: npm run verify:workflow-governance
        timeout-minutes: 45

  source_node_26:
    name: CI / Ubuntu / Node 26.12.0
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
        with:
          node-family: "26"
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Select the pinned development Python
        id: quality_python
        run: node scripts/repository-python-tools.mjs python
        timeout-minutes: 10
      - name: Synchronize locked development tools
        run: npm run sync:python-tools -- --python-env QUALITY_PYTHON
        timeout-minutes: 5
        env:
          QUALITY_PYTHON: ${{ steps.quality_python.outputs.python-path }}
      - name: Acquire the exact isolated JSON graph
        run: npm run install:json
        timeout-minutes: 5
      - name: Exercise JSON isolation and exact preservation probes
        run: npm run test:json
        timeout-minutes: 5
      - name: Verify complete JSON coverage on Node 26
        run: npm run check:json
        timeout-minutes: 5
      - name: Verify semantic JSON identity on Node 26
        run: npm run lint:json-identity
        timeout-minutes: 5
      - name: Verify formatting
        run: npm run format:source-python:check
        timeout-minutes: 45
      - name: Verify static quality
        run: npm run lint:source-python
        timeout-minutes: 45
      - name: Run the full package suite
        run: npm test -- --runInBand
        timeout-minutes: 45
      - name: Verify the public package boundary
        run: npm run test:boundary
        timeout-minutes: 45
      - name: Verify the release-gate registry
        run: npm run verify:release-gates
        timeout-minutes: 45
      - name: Verify repository workflow governance
        run: npm run verify:workflow-governance
        timeout-minutes: 45
      - name: Check complete JSON after every native producer
        run: npm run check:json
        timeout-minutes: 5

  source_node_24:
    name: CI / Ubuntu / Node 24.22.0
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      reference: ${{ steps.reference_publication.outputs.reference }}
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Select the pinned development Python
        id: quality_python
        run: node scripts/repository-python-tools.mjs python
        timeout-minutes: 10
      - name: Synchronize locked development tools
        run: npm run sync:python-tools -- --python-env QUALITY_PYTHON
        timeout-minutes: 5
        env:
          QUALITY_PYTHON: ${{ steps.quality_python.outputs.python-path }}
      - name: Qualify the locked Python 3.15 scanner
        id: scanner_qualification
        run: node util/qualify-scancode-runtime.mjs --python-env=SCANCODE_PYTHON --work-root-env=SCANCODE_WORK_ROOT
        timeout-minutes: 45
        env:
          SCANCODE_PYTHON: ${{ steps.quality_python.outputs.python-path }}
          SCANCODE_WORK_ROOT: ${{ runner.temp }}/scancode-qualification
      - name: Retain scanner compatibility reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scancode-qualification-source_node_24
          path: .release/scancode-qualification/reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
      - name: Acquire the exact isolated Markdown graph
        run: npm run install:markdown
        timeout-minutes: 5
      - name: Acquire the exact isolated JSON graph
        run: npm run install:json
        timeout-minutes: 5
      - name: Exercise JSON isolation and exact preservation probes
        run: npm run test:json
        timeout-minutes: 5
      - name: Exercise canonical Markdown isolation probes
        run: npm run test:markdown
        timeout-minutes: 5
      - name: Verify formatting
        run: npm run format:check
        timeout-minutes: 45
      - name: Verify static quality
        run: npm run lint
        timeout-minutes: 45
      - name: Install checksum-pinned native workflow validation
        run: |
          tool_directory="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir -p "$tool_directory"
          archive="$tool_directory/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_directory"
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"
        timeout-minutes: 5
      - name: Validate native GitHub Actions syntax and expressions
        run: npm run verify:workflow-syntax
        timeout-minutes: 5
      - name: Observe integration applicability while retaining full qualification
        run: node scripts/ci-check-applicability.mjs
        timeout-minutes: 1
      - name: Check out the immutable original July ontology sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/universal-ontology
          ref: e2c667f3584b8fb705671cada0fe205b1000b617
          path: .release/universal-ontology
          persist-credentials: false
      - name: Check out the pinned Java OWLAPI reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: owlcs/owlapi
          ref: b61ebe2da83daceebb3e7ba7afbd2582c9240c33
          path: .release/java-owlapi
          persist-credentials: false
      - name: Select the reference JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4+101.0.LTS"
          check-latest: false
          overwrite-settings: false
          cache: ""
          cache-jdk: false
      - name: Install the checksum-pinned native Maven reference tool
        run: |
          tool_directory="$RUNNER_TEMP/reference-maven-3.10.0"
          mkdir "$tool_directory"
          archive="$tool_directory/apache-maven-3.10.0-bin.zip"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 60 --retry 2 --retry-max-time 120 \
            https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.zip \
            --output "$archive"
          printf '%s  %s\n' '22d31676d5b92ed53308c19ecded3245d0efd0cddfec51ec7bab62f4f13ad70ddddceff8e62940e0e8e2421f3cde8106737f4becec0aa034ffeff2a754e88337' "$archive" | sha512sum --check --strict
          unzip -q "$archive" -d "$tool_directory"
        timeout-minutes: 3
      - name: Measure a separate fresh baseline for inactive reference-control changes
        run: node util/owlapi-reference/reference-cost-observation.mjs
        timeout-minutes: 4
      - name: Observe the controlled native reference inputs before compilation
        run: node scripts/java-reference-command.mjs prepare
        timeout-minutes: 10
      - name: Select the exact captured-base main discovery index
        id: reference_index
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/java-reference-command.mjs index
        timeout-minutes: 1
      - name: Download the bounded exact-base discovery index
        id: reference_index_download
        if: steps.reference_index.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.reference_index.outputs.artifact_id }}
          run-id: ${{ steps.reference_index.outputs.run_id }}
          repository: Hadden-Industries/owlapi
          github-token: ${{ github.token }}
          path: .release/java-reference-reuse/index-download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Select an exact qualified main reference product
        id: reference_select
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_INDEX_DOWNLOAD_OUTCOME: ${{ steps.reference_index_download.outcome }}
        run: node scripts/java-reference-command.mjs select
        timeout-minutes: 1
      - name: Download the exact reference and its independent main qualification
        id: reference_download
        if: steps.reference_select.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.reference_select.outputs.artifact_ids }}
          run-id: ${{ steps.reference_select.outputs.run_id }}
          repository: Hadden-Industries/owlapi
          github-token: ${{ github.token }}
          path: .release/java-reference-reuse/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Admit the exact reference or select a fresh build
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_DOWNLOAD_OUTCOME: ${{ steps.reference_download.outcome }}
        run: node scripts/java-reference-command.mjs admit
        timeout-minutes: 1
      - name: Materialize or freshly compile the controlled native reference
        id: reference_build
        run: node scripts/java-reference-command.mjs build
        timeout-minutes: 10
      - name: Prepare the accepted sources and notices for an activated fresh main product
        id: reference_package
        run: node scripts/java-reference-command.mjs package
        timeout-minutes: 5
      - name: Run the full package suite
        env:
          OWLAPI_REFERENCE_CHECKOUT: ${{ github.workspace }}/.release/java-owlapi
        run: |
          mkdir -p .release/java-qualification
          npm test -- --runInBand --json --outputFile=.release/java-qualification/jest.json
        timeout-minutes: 45
      - name: Record complete live Java test execution
        id: coverage
        env:
          OWLAPI_REFERENCE_CHECKOUT: ${{ github.workspace }}/.release/java-owlapi
        run: node scripts/ci-check-coverage-command.mjs java .release/java-qualification/jest.json
        timeout-minutes: 1
      - name: Verify the public package boundary
        run: npm run test:boundary
        timeout-minutes: 45
      - name: Verify the release-gate registry
        run: npm run verify:release-gates
        timeout-minutes: 45
      - name: Verify repository workflow governance
        run: npm run verify:workflow-governance
        timeout-minutes: 45
      - name: Reconcile all four July variants in parsing and both closure formats
        env:
          OWLAPI_REFERENCE_CHECKOUT: ${{ github.workspace }}/.release/java-owlapi
        run: npm run test:universal-ontology -- --ontology-repository .release/universal-ontology --output .release/july-qualification
        timeout-minutes: 15
      - name: Capture original native JSON reports before the final quality gate
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .release/july-qualification
          : > .release/july-qualification/native-json-files.nul
          if test -d .release/java-owlapi; then
            find .release/java-owlapi -path '*/target/reference-runtime-tree.json' -type f -print0 >> .release/july-qualification/native-json-files.nul
          fi
          if test -f .release/java-qualification/jest.json; then
            printf '%s\0' .release/java-qualification/jest.json >> .release/july-qualification/native-json-files.nul
          fi
          if test -f .release/java-reference-reuse/native/build-attempt.json; then
            printf '%s\0' .release/java-reference-reuse/native/build-attempt.json >> .release/july-qualification/native-json-files.nul
          fi
          tar --null --files-from=.release/july-qualification/native-json-files.nul -czf .release/july-qualification/native-json-originals.tar.gz
        timeout-minutes: 1
      - name: Retain July reconciliation evidence, including failed comparisons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: july-ontology-reconciliation
          path: .release/july-qualification
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
          archive: true

      - name: Retain an immutable activated fresh main reference product
        id: reference_upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.reference_package.outputs.publish == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.reference_package.outputs.artifact_name }}
          path: .release/java-reference-reuse/publication
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
      - name: Record the exact uploaded product without changing behavioral coverage
        id: reference_publication
        env:
          REFERENCE_UPLOAD_OUTCOME: ${{ steps.reference_upload.outcome }}
          REFERENCE_ARTIFACT_ID: ${{ steps.reference_upload.outputs.artifact-id }}
          REFERENCE_ARTIFACT_DIGEST: ${{ steps.reference_upload.outputs.artifact-digest }}
        run: node scripts/java-reference-command.mjs publication
        timeout-minutes: 1
      - name: Check complete JSON after every native producer
        run: npm run check:json
        timeout-minutes: 5

  dependency_review:
    name: CI / dependency review
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
        with:
          npm-timeout-minutes: "10"
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Review introduced runtime vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          warn-only: false
          show-openssf-scorecard: false
          show-patched-versions: false
      - name: Record dependency-review applicability on main push
