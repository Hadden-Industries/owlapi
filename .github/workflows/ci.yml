      - name: Download the exact same-run candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: .release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify the closed candidate inventory and checksums
        run: npm run candidate:prepare -- --candidate .release/download
        timeout-minutes: 5
      - name: Qualify the installed public package boundary
        run: npm run candidate:portable -- --candidate .release/download --output .release/download/portability.json
        timeout-minutes: 20

