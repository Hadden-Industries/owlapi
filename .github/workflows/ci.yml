  webvowl:
    name: CI / isolated WebVOWL consumer
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: owlapi
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - name: Check out the proposed owlapi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: owlapi
          persist-credentials: false
      - name: Check out the fixed WebVOWL consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/webvowl
          ref: 4f1970e5b6c95655af823c495bd58f9e9993f8b8
          # WebVOWL's governance suite proves retained reconstruction ancestry.
          # A shallow checkout would make valid recorded commits unreachable.
          fetch-depth: 0
          path: consumer-workspace/webvowl
          persist-credentials: false
      - name: Check out the fixed representative ontology corpus
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/universal-ontology
          ref: c2220675b0f3345628fc9cc8112a41440afcb2f0
          fetch-depth: 1
          path: consumer-workspace/universal-ontology
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.21.0 --npm 12.1.0
        timeout-minutes: 5
      # universal-ontology intentionally ignores dist/, so the pinned source
      # checkout must materialize the exact corpus before WebVOWL can consume it.
      - name: Install the fixed ontology corpus dependencies
        working-directory: consumer-workspace/universal-ontology
        run: npm ci
        timeout-minutes: 20
      - name: Materialize the fixed representative ontology corpus
        working-directory: consumer-workspace/universal-ontology
        run: npm run build
        timeout-minutes: 20
      - name: Install the independently locked owlapi qualification tools
        run: npm ci
        timeout-minutes: 20
      - name: Install the managed Chromium revision
        run: npm run playwright:install -- --with-deps chromium
        timeout-minutes: 20
      - name: Record the hosted runner and browser identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash --browser-project chromium
        timeout-minutes: 5
      - name: Download the exact same-run candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: owlapi/.release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify the closed candidate inventory and checksums
        run: npm run candidate:prepare -- --candidate .release/download
        timeout-minutes: 5
      - name: Qualify the retained package through isolated WebVOWL
        # CI exercises the reviewed candidate without claiming release acceptance.
        # The release workflow retains the strict reconciled qualification route.
        run: npm run test:webvowl-consumer -- --candidate-dir .release/download --webvowl-repository ../consumer-workspace/webvowl --expected-webvowl-commit 4f1970e5b6c95655af823c495bd58f9e9993f8b8 --expected-ontology-commit c2220675b0f3345628fc9cc8112a41440afcb2f0 --development-audit test/consumers/webvowl/development-audit.json --output .release/webvowl-result
        timeout-minutes: 45
      - name: Record complete native WebVOWL qualification
        id: coverage
        run: node scripts/ci-check-coverage-command.mjs webvowl .release/webvowl-result/qualification.json
        timeout-minutes: 1

  required:
    name: CI / required
    if: ${{ always() }}
    needs:
      - verification
      - metadata
      - source_node_22
      - source_node_24
      - dependency_review
      - candidate
      - portability_windows_node_22
      - portability_windows_node_24
      - portability_macos_node_22
      - portability_macos_node_24
      - browser_chromium
      - browser_firefox
      - browser_webkit
      - webvowl
      - quality_windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the aggregate evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Require full qualification or verified reuse
        env:
          REQUIRED_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/require-job-success.mjs --workflow ci
        timeout-minutes: 5
      - name: Record successful full PR qualification
        id: receipt
        if: github.event_name == 'pull_request'
        env:
          REQUIRED_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-verification-command.mjs record
        timeout-minutes: 5
      - name: Retain the immutable PR verification receipt
        id: receipt_upload
        if: steps.receipt.outputs.recorded == 'true'
        # Missing evidence makes the later main push run full qualification.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/ci-verification/verification.json
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
      - name: Record successful landed-main qualification
        id: main_receipt
        if: github.event_name == 'push'
        env:
          REQUIRED_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-verification-command.mjs record-main
        timeout-minutes: 1
      - name: Retain the immutable main qualification record
        id: main_receipt_upload
        if: steps.main_receipt.outputs.recorded == 'true'
        # Unavailable lineage requires full execution on the next candidate.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-main-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/ci-main-qualification/verification.json
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
  quality_windows:
    name: CI / Windows / quality tools
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Select Node 24.21.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.1.0 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.21.0 --npm 12.1.0
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Windows --expected-arch X64 --label windows-2025 --shell pwsh
        timeout-minutes: 5
      - name: Select the pinned development Python
        id: quality_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
          architecture: x64
          check-latest: false
          update-environment: false
          cache: ""
      - name: Synchronize locked development tools
        run: npm run tools:sync -- --python-env QUALITY_PYTHON
        timeout-minutes: 5
        env:
          QUALITY_PYTHON: ${{ steps.quality_python.outputs.python-path }}
      - name: Verify the locked environment
        run: npm run tools:check
        timeout-minutes: 10
      - name: Verify formatting
        run: npm run format:check
        timeout-minutes: 10
      - name: Verify static quality
        run: npm run lint
        timeout-minutes: 10
      - name: Run native quality regressions
        run: npm run test:quality
        timeout-minutes: 10
