  owl_contract:
    name: CI / installed OWL contract
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the proposed producer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
      - name: Install the independently locked producer qualification tools
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Download the exact same-run candidate by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          path: .release/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify the closed candidate inventory and checksums
        run: npm run prepare:downloaded-candidate -- --candidate .release/download
        timeout-minutes: 5
      - name: Qualify installed public OWL interfaces against current consumer source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
        run: npm run test:owl-contract -- --candidate .release/download --output .release/owl-contract
        timeout-minutes: 10
      - name: Retain failed native OWL contract assertions
        if: ${{ failure() && hashFiles('.release/owl-contract/native.ndjson') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owl-contract-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/owl-contract/native.ndjson
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
          archive: true
      - name: Record complete native OWL contract qualification
        id: coverage
        run: node scripts/ci-check-coverage-command.mjs owl_contract .release/owl-contract/qualification.json
        timeout-minutes: 1
      - name: Retain exact installed OWL contract proof
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owl-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/owl-contract/qualification.json
            .release/owl-contract/native.ndjson
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  consumer_runtime:
    name: CI / consumer / ${{ matrix.runner }} / Node ${{ matrix.node }}
    needs: [runtime_matrix, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.runtime_matrix.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/qualify-consumer
        with:
          matrix: ${{ needs.runtime_matrix.outputs.matrix }}
          node: ${{ matrix.node }}
          candidate-id: ${{ needs.candidate.outputs.artifact_id }}
          candidate-digest: sha256:${{ needs.candidate.outputs.artifact_digest }}
      - name: Retain the actual consumer lane evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-runtime-${{ matrix.runner }}-${{ matrix.node }}-attempt-${{ github.run_attempt }}
          path: .release/runtime-report/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

  consumer_runtimes:
    name: CI / complete consumer qualification
    needs: [runtime_matrix, candidate, consumer_runtime]
    if: ${{ !cancelled() && needs.candidate.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      coverage: ${{ steps.require.outputs.coverage }}
      artifact_id: ${{ steps.require.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: require
        uses: ./.github/actions/aggregate-consumer-runtimes
        with:
          matrix: ${{ needs.runtime_matrix.outputs.matrix }}
          lanes-result: ${{ needs.consumer_runtime.result }}
          candidate-id: ${{ needs.candidate.outputs.artifact_id }}
          candidate-digest: sha256:${{ needs.candidate.outputs.artifact_digest }}

  required:
    name: CI / required
    env:
      OWLAPI_RUNTIME_MATRIX: ${{ needs.runtime_matrix.outputs.matrix }}
    if: ${{ always() }}
    needs:
      - verification
      - runtime_matrix
      - consumer_runtime
      - consumer_runtimes
      - metadata
      - source_node_22
      - source_node_24
      - source_node_26
      - dependency_review
      - candidate
      - portability_windows_node_22
      - portability_windows_node_24
      - portability_macos_node_22
      - portability_macos_node_24
      - portability_ubuntu_node_26
      - portability_windows_node_26
      - portability_macos_node_26
      - browser_chromium
      - browser_firefox
      - browser_webkit
      - owl_contract
      - quality_windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the aggregate evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select the policy-owned Node runtime
        uses: ./.github/actions/setup-producer
        with:
          phase: runtime
      - name: Require full qualification or verified reuse
        env:
          REQUIRED_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/require-job-success.mjs --workflow ci
        timeout-minutes: 5
      - name: Record successful full PR qualification
        id: receipt
        if: github.event_name == 'pull_request'
        env:
          REQUIRED_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-verification-command.mjs record
        timeout-minutes: 5
      - name: Retain the immutable PR verification receipt
        id: receipt_upload
        if: steps.receipt.outputs.recorded == 'true'
        # Missing evidence makes the later main push run full qualification.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/ci-verification/verification.json
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
      - name: Record successful landed-main qualification
        id: main_receipt
        if: github.event_name == 'push'
        env:
          REQUIRED_JOB_RESULTS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci-verification-command.mjs record-main
        timeout-minutes: 1
      - name: Retain the immutable main qualification record
        id: main_receipt_upload
        if: steps.main_receipt.outputs.recorded == 'true'
        # Unavailable lineage requires full execution on the next candidate.
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-main-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/ci-main-qualification/verification.json
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
  quality_windows:
    name: CI / Windows / quality tools
    needs: verification
    if: needs.verification.outputs.reuse != 'true'
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the policy-owned Node/npm runtime
        uses: ./.github/actions/setup-producer
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run record:runner -- --expected-os Windows --expected-arch X64 --label windows-2025 --shell pwsh
        timeout-minutes: 5
      - name: Select the pinned development Python
        id: quality_python
        run: node scripts/repository-python-tools.mjs python
        timeout-minutes: 10
      - name: Synchronize locked development tools
        run: npm run sync:python-tools -- --python-env QUALITY_PYTHON
        timeout-minutes: 5
        env:
          QUALITY_PYTHON: ${{ steps.quality_python.outputs.python-path }}
      - name: Qualify the locked Python 3.15 scanner
        id: scanner_qualification
        run: node util/qualify-scancode-runtime.mjs --python-env=SCANCODE_PYTHON --work-root-env=SCANCODE_WORK_ROOT
        timeout-minutes: 45
        env:
          SCANCODE_PYTHON: ${{ steps.quality_python.outputs.python-path }}
          SCANCODE_WORK_ROOT: ${{ runner.temp }}/scancode-qualification
      - name: Retain scanner compatibility reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scancode-qualification-quality_windows
          path: .release/scancode-qualification/reports
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
      - name: Verify the locked environment
        run: npm run check:python-tools
        timeout-minutes: 10
      - name: Acquire the exact isolated Markdown graph
        run: npm run install:markdown
        timeout-minutes: 5
      - name: Acquire the exact isolated JSON graph
        run: npm run install:json
        timeout-minutes: 5
      - name: Exercise JSON isolation and exact preservation probes
        run: npm run test:json
        timeout-minutes: 5
      - name: Verify formatting
        run: npm run format:check
        timeout-minutes: 10
      - name: Verify static quality
        run: npm run lint
        timeout-minutes: 10
      - name: Run native quality regressions
        run: npm run test:quality
        timeout-minutes: 10
      - name: Check complete JSON after every native producer
        run: npm run check:json
        timeout-minutes: 5
