name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  npm_config_fetch_retries: "2"
  npm_config_fetch_retry_factor: "10"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"
  npm_config_fetch_timeout: "300000"

jobs:
  metadata:
    name: CI / metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out the accepted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 5
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.19.0 --npm 12.0.2
        timeout-minutes: 5
      - name: Install the reviewed tool graph
        run: npm ci
        timeout-minutes: 8
      - name: Derive validated package metadata
        id: metadata
        run: npm run workflow:metadata
        timeout-minutes: 5
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5

  source_node_22:
    name: CI / Ubuntu / Node 22.23.2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Governance verifies the recorded annotated tag and peeled commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Select Node 22.23.2 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 22.23.2 --npm 12.0.2
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Verify formatting
        run: npm run format:check
        timeout-minutes: 45
      - name: Verify static quality
        run: npm run lint
        timeout-minutes: 45
      - name: Run the full package suite
        run: npm test -- --runInBand
        timeout-minutes: 45
      - name: Verify the public package boundary
        run: npm run test:boundary
        timeout-minutes: 45
      - name: Verify the release-gate registry
        run: npm run verify:release-gates
        timeout-minutes: 45
      - name: Verify repository workflow governance
        run: npm run verify:workflow-governance
        timeout-minutes: 45

