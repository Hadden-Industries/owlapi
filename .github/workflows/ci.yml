  dependency_review:
    name: CI / dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 10
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.19.0 --npm 12.0.2
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 15
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Review introduced runtime vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          vulnerability-check: true
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
          warn-only: false
          show-openssf-scorecard: false
          show-patched-versions: false
      - name: Record dependency-review applicability on main push
        if: github.event_name == 'push'
        run: npm run workflow:dependency-review-applicability
        timeout-minutes: 5

  candidate:
    name: CI / retained candidate
    needs:
      - metadata
      - source_node_22
      - source_node_24
      - dependency_review
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select authoritative Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.19.0 --npm 12.0.2
        timeout-minutes: 5
      - name: Install the reviewed dependency graph
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Build and qualify the closed candidate bundle
        run: npm run release:pack
        timeout-minutes: 45
      - name: Upload the exact same-run candidate
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: |
            .release/candidate/${{ needs.metadata.outputs.version }}/owlapi-${{ needs.metadata.outputs.version }}.tgz
            .release/candidate/${{ needs.metadata.outputs.version }}/owlapi-${{ needs.metadata.outputs.version }}.cdx.json
            .release/candidate/${{ needs.metadata.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true

