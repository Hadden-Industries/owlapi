name: Prepare or seal verified GitHub release
on:
  workflow_dispatch:
    inputs:
      history_object:
        description: Original signed protected history tag object SHA
        type: string
        required: true
      operation:
        description: Operation bound by the signed checkpoint
        required: true
        type: choice
        options: [draft, seal]
      settings_object:
        description: Optional signed immutable-settings renewal for the original seal operation
        type: string
        required: false
permissions: {}
concurrency:
  group: owlapi-release
  cancel-in-progress: false
  queue: max
jobs:
  draft:
    if: github.repository == 'Hadden-Industries/owlapi' && github.ref == 'refs/heads/main' && inputs.operation == 'draft'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment: release-manual
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Prepare or seal verified GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_OBJECT: ${{ inputs.history_object }}
        run: node scripts/staged-release-followup.mjs draft
      - name: Retain original operation evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/retain-artifact
        with:
          name: github-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/followup
          retention-days: 90
  seal:
    if: github.repository == 'Hadden-Industries/owlapi' && github.ref == 'refs/heads/main' && inputs.operation == 'seal'
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    environment: release-manual
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: ./.github/actions/setup-producer
      - name: Prepare or seal verified GitHub release (seal)
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_OBJECT: ${{ inputs.history_object }}
          SETTINGS_OBJECT: ${{ inputs.settings_object }}
        run: node scripts/staged-release-followup.mjs seal
      - name: Retain original operation evidence
        if: ${{ !cancelled() }}
        uses: ./.github/actions/retain-artifact
        with:
          name: github-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release/followup
          retention-days: 90
