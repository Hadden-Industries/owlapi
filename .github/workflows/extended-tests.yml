name: Extended tests

on:
  schedule:
    - cron: "43 5 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: owlapi-extended-tests
  cancel-in-progress: false

jobs:
  extended_evidence:
    name: Extended tests / transparent observations
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select Node 24.19.0 without package caching
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          check-latest: false
          cache: ""
          package-manager-cache: false
      - name: Establish the exact repository npm
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
        timeout-minutes: 20
      - name: Verify the exact runtime pair
        run: node scripts/assert-workflow-runtime.mjs --node 24.19.0 --npm 12.0.2
        timeout-minutes: 5
      - name: Install the reviewed observation tools
        run: npm ci
        timeout-minutes: 20
      - name: Record the hosted runner identity
        run: npm run workflow:runner-record -- --expected-os Linux --expected-arch X64 --label ubuntu-24.04 --shell bash
        timeout-minutes: 5
      - name: Verify the current package before recording extensions
        run: npm test -- --runInBand
        timeout-minutes: 45
      - name: Report every planned extended environment honestly
        run: npm run extended:record-status
        timeout-minutes: 5
