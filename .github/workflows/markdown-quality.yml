name: Trusted Markdown qualification

on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Reviewed 40-character OwlAPI bootstrap commit accepted by the owner
        required: true
        type: string
      candidate_repository:
        description: Public candidate repository; content is inspected only as data
        required: true
        default: Hadden-Industries/owlapi
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit to qualify
        required: true
        type: string

permissions: {}

jobs:
  markdown:
    permissions:
      contents: read
    uses: Hadden-Industries/markdown-quality/.github/workflows/markdown-quality.yml@47febbe1b6f3282814e77db7ea13eac72b4928ed
    with:
      trusted-repository: Hadden-Industries/owlapi
      trusted-sha: ${{ inputs.trusted_sha }}
      candidate-repository: ${{ inputs.candidate_repository }}
      candidate-sha: ${{ inputs.candidate_sha }}
      profile: .markdown-quality-execution.json
